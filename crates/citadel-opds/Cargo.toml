[package]
name = "citadel-opds"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "OPDS catalog, authentication, and networking runtime for Citadel"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4.31", features = ["serde"] }
futures-util = "0.3"
libcalibre = { path = "../libcalibre" }
netdev = { version = "=0.45.0", default-features = false }
quick-xml = "0.38"
socket2 = "0.6"
serde = { version = "1.0", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["chrono", "derive"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
urlencoding = "2.1.3"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }

[dev-dependencies]
diesel = { version = "2.2.4", features = ["sqlite"] }
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3.8"
tower = "0.5"
