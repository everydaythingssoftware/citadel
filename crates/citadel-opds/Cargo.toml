[package]
name = "citadel-opds"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Tauri-independent OPDS runtime for Citadel"

[dependencies]
axum = "0.8.9"
bytes = "1"
chrono = { version = "0.4.31", features = ["serde"] }
futures-util = "0.3"
libcalibre = { path = "../libcalibre" }
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
urlencoding = "2.1.3"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }

[dev-dependencies]
tempfile = "3.8"
