# Optional. Holds citadel.db (users, sessions, grants, the served library).
# On Unix defaults to $XDG_STATE_HOME/citadel or ~/.local/state/citadel.
# stateDirectory = "/var/lib/citadel"

# Browsers reach Citadel here; it is also where the server is set up on first
# run, with the code the server prints when it starts.
[api]
listen = "127.0.0.1:8081"
# Optional: the public URLs browsers reach Citadel at. Once set, other
# addresses are refused; without any, Citadel answers at every address.
# publicUrls = ["https://books.example.com", "http://nas.local:8081"]
# Optional: serve a frontend built with `bun run build:web`.
# webDirectory = "/absolute/path/to/citadel/dist"

[sharing]
port = 8080

[sharing.target.addresses]
addresses = ["127.0.0.1"]

# Optional. Release builds ask GitHub for the latest Citadel release once a
# day and tell administrators in the browser; nothing about this server is
# sent. Set to false to turn that off.
# [updates]
# check = false
