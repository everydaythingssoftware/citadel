[package]
name = "libcalibre"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Read and write Calibre ebook libraries (metadata.db and the book folders beside it)"
license = "MIT"
repository = "https://github.com/everydaythingssoftware/citadel"
readme = "README.md"
keywords = ["calibre", "ebook", "library", "sqlite", "epub"]
categories = ["database", "parser-implementations"]
# The fixture is a schema dump of a library Calibre 7.2 made, for upgrade tests.
exclude = ["diesel.toml", "tests/fixtures/"]

[dependencies]
chrono = "0.4.31"
diesel = { version = "2.2.4", features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
epub = { version = "2.1.1", optional = true }
hayro = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
libsqlite3-sys = { version = "0.30", optional = true, features = ["bundled"] }
mobi = { version = "0.8.0", optional = true }
percent-encoding = { version = "2.3", optional = true }
regex = "1.10.2"
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.6.1", features = [ "v4", "fast-rng", ] }
sanitise-file-name = "1.0.0"
# Same major as epub's, so the cover reader shares its archive code.
zip = { version = "3", default-features = false, features = ["deflate"], optional = true }

# The PDF cover worker limits its own memory and CPU time.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = ["epub", "mobi", "pdf"]
# Read metadata and covers from EPUB files.
epub = ["dep:epub", "dep:percent-encoding", "dep:zip"]
# Read metadata and covers from MOBI, AZW and AZW3 files.
mobi = ["dep:mobi"]
# Render a PDF's first page as its cover.
pdf = ["dep:hayro", "dep:image", "dep:libc", "dep:windows-sys"]
# Compile SQLite into the binary instead of linking the system library.
bundled-sqlite = ["dep:libsqlite3-sys"]
# Exposes connection helpers to this crate's tests and examples. Not public API.
__internals = []

[dev-dependencies]
libcalibre = { path = ".", features = ["__internals"] }
fastrand = "2.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
insta = { version = "1.40", features = ["yaml"] }
proptest = "1.4"
rusqlite = { version = "0.32", features = ["functions"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3.8"

# Its own `main` opts in to the PDF cover worker, which a libtest harness
# can't do.
[[test]]
name = "pdf_cover_test"
harness = false
required-features = ["pdf"]
