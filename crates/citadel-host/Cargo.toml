[package]
name = "citadel-host"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Operating-system networking for Citadel's core crates: interfaces and listening sockets"

[dependencies]
axum = "0.8.9"
citadel-core = { path = "../citadel-core" }
citadel-opds = { path = "../citadel-opds" }
netdev = { version = "=0.45.0", default-features = false }
reqwest = "0.12"
socket2 = "0.6"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync"] }
