[workspace]
resolver = "2"
members = [
    "crates/citadel-core",
    "crates/citadel-epub",
    "crates/citadel-metadata",
    "crates/citadel-opds",
    "crates/citadel-server",
    "crates/libcalibre",
    "src-tauri",
]
# Built with nightly by .github/workflows/fuzz.yml.
exclude = ["crates/citadel-epub/fuzz"]

[workspace.package]
# citadel-desktop and citadel-server release together under one version.
version = "0.7.2"
rust-version = "1.97.1"

# Cover thumbnail generation decodes/resizes JPEGs through these crates;
# unoptimized they run 20-50x slower, turning the background thumbnail warm
# from seconds into minutes in dev builds. Optimizing just these packages
# keeps dev compile times intact.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
# Argon2id unoptimized takes about a second per hash, which makes the
# sign-in guard's tests (ADR 0017) crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
