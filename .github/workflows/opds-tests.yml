name: OPDS runtime and headless server

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-server:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04", "macos-latest", "windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for server/OPDS changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            'crates/citadel-core/' 'crates/citadel-metadata/' 'crates/citadel-opds/' 'crates/citadel-server/' 'crates/libcalibre/' \
            'api/' 'tools/api/' 'src/lib/api/' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' '.github/workflows/opds-tests.yml' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No server/OPDS files changed — nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
        with:
          prefix-key: "v2-opds-runtime"
          workspaces: "."

      - name: Cache vcpkg SQLite binary on Windows
        if: steps.changes.outputs.run == 'true' && runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-sqlite3-fts5-${{ runner.os }}-v1

      # Calibre's annotations table has FTS5 triggers, so deleting a book
      # needs an SQLite built with FTS5.
      - name: Install SQLite on Windows
        if: steps.changes.outputs.run == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          vcpkg install "sqlite3[core,json1,fts5]:x64-windows-static-md"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV

      - name: Install SQLite on Linux
        if: steps.changes.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev

      - name: Test runtime and headless host without Tauri
        if: steps.changes.outputs.run == 'true'
        run: cargo test --locked -p citadel-core --features citadel-core/openapi -p citadel-metadata -p citadel-opds -p citadel-server

      - name: Test validation fixture input checks
        if: steps.changes.outputs.run == 'true'
        run: cargo test --locked -p citadel-opds --example create_opds_validation_library

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run == 'true' && runner.os == 'Linux'
        with:
          bun-version: "1.4.4"

      - name: Check generated HTTP contract
        if: steps.changes.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          bun install --frozen-lockfile
          bun api:check
