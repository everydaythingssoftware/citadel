name: OPDS runtime and headless server

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: opds-runtime
          workspaces: "."
      # Calibre's annotations table has FTS5 triggers, so deleting a book
      # needs an SQLite built with FTS5.
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "sqlite3[core,json1,fts5]:x64-windows-static-md"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" >> $env:GITHUB_ENV
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config libssl-dev
      - name: Test runtime and headless host without Tauri
        run: cargo test --locked -p citadel-core --features citadel-core/openapi -p citadel-metadata -p citadel-opds -p citadel-server
      - name: Test validation fixture input checks
        run: cargo test --locked -p libcalibre --example create_opds_validation_library

      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'
      - name: Check generated HTTP contract and client
        if: runner.os == 'Linux'
        run: |
          bun install --frozen-lockfile
          bun api:check
          bun typecheck
          bun run test src/lib/api/client.test.ts --run
