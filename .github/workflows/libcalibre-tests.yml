name: libcalibre Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-libcalibre:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for libcalibre changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            'crates/libcalibre/' 'crates/citadel-epub/' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' '.github/workflows/libcalibre-tests.yml' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No libcalibre files changed — nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
        with:
          prefix-key: "v2-libcalibre"
          workspaces: "."

      - name: Build without optional features
        if: steps.changes.outputs.run == 'true'
        run: cargo build --locked --package libcalibre --no-default-features

      - name: Run tests
        if: steps.changes.outputs.run == 'true'
        run: cargo test --locked --package libcalibre --all-features

      # libcalibre reads EPUBs through citadel-epub; its hostile-file tests
      # run each case in a child process on a small stack.
      - name: Run citadel-epub tests
        if: steps.changes.outputs.run == 'true'
        run: cargo test --locked --package citadel-epub

      - name: Check docs (every public item documented, links resolve)
        if: steps.changes.outputs.run == 'true'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --package libcalibre --all-features --no-deps
