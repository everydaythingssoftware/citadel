name: libcalibre Tests

on:
  push:
    branches:
      - main
    paths:
      - "crates/libcalibre/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/libcalibre-tests.yml"
  pull_request:
    paths:
      - "crates/libcalibre/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/libcalibre-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-libcalibre"
          workspaces: "."

      - name: Build without optional features
        run: cargo build --locked --package libcalibre --no-default-features

      - name: Run tests
        run: cargo test --locked --package libcalibre --all-features

      - name: Check docs (every public item documented, links resolve)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --package libcalibre --all-features --no-deps
