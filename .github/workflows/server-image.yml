name: Server image

# Pull requests build and smoke-test the image on both architectures without
# pushing. The release workflow calls this with `push` to publish it.
on:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: "Release version baked into the server, such as 0.8.0"
        type: string
        required: true
      tags:
        description: "Image tags to publish, one per line, such as 0.8.0, 0.8 and latest"
        type: string
        required: true
      push:
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/everydaythingssoftware/citadel-server

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CITADEL_VERSION=${{ inputs.version }}
            CITADEL_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-image-${{ matrix.arch }}
          load: true
          tags: citadel-server:smoke

      - name: Smoke test
        run: docker/smoke-test.sh citadel-server:smoke

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer comes from its cache.
      - name: Push by digest
        if: inputs.push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CITADEL_VERSION=${{ inputs.version }}
            CITADEL_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=server-image-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        if: inputs.push
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: inputs.push
        with:
          name: server-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-image-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures under one name
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$IMAGE:$tag")
          done <<< "$TAGS"
          [ "${#tag_args[@]}" -gt 0 ] || { echo "No tags given"; exit 1; }
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$(head -n1 <<< "$TAGS")"
