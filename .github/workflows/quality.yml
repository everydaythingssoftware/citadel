name: Quality checks
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check_formatting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ hashFiles('rust-toolchain.toml') }}"
          workspaces: "."

      - name: Install node packages
        run: bun install

      - name: List installed versions
        run: |
          bun --version;
          cargo --version;
          bun tauri --version;

      - name: Check Formatting
        run: bun format:check

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          RUST_VERSION="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$RUST_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          test "$(rustc --version | awk '{print $2}')" = "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ hashFiles('rust-toolchain.toml') }}"
          workspaces: "."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install node packages
        run: bun install

      - name: List installed versions
        run: |
          bun --version;
          cargo --version;
          bun tauri --version;

      - name: Check Linting
        run: bun lint
