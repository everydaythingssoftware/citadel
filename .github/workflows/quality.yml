name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Install node packages
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun format:check

  lint-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install node packages
        run: bun install --frozen-lockfile

      - name: Lint frontend and service boundaries
        run: bun lint:web

      - name: Typecheck
        run: bun typecheck

  test-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install node packages
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test --run

  lint-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            'crates/' 'src-tauri/' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' '.github/workflows/quality.yml' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Rust files changed — nothing to lint."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
        with:
          prefix-key: "v2-rust"
          workspaces: "."

      - name: Install Linux Tauri dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clippy
        if: steps.changes.outputs.run == 'true'
        run: cargo clippy --workspace

  test-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for desktop Rust changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            'crates/' 'src-tauri/' 'Cargo.toml' 'Cargo.lock' 'rust-toolchain.toml' '.github/workflows/quality.yml' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No desktop Rust files changed — nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.run == 'true'
        with:
          prefix-key: "v2-rust"
          workspaces: "."

      - name: Install Linux Tauri dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Test desktop adapters and IPC contract
        if: steps.changes.outputs.run == 'true'
        run: cargo test --locked -p citadel-desktop
