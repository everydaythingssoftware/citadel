name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-24.04", "macos-latest", "windows-latest", "windows-11-arm"]' || '["ubuntu-24.04", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v2-rust"
          workspaces: "."

      - name: (Ubuntu only) Install dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: (Windows ARM64 only) Ensure clang is on PATH
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH

      - name: Install node packages
        run: bun install --frozen-lockfile

      # Full installers are packaged nightly and on release in release.yml.
      - name: Build desktop app (no bundle)
        run: bun tauri build --no-bundle
